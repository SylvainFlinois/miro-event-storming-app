<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toggle par tag</title>
<script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
<style>
  :root { --fg:#1a1a2e; --muted:#6b6b80; --line:#e4e4ec; --accent:#4262ff; --bg:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--fg); background:var(--bg); }
  h1 { font-size:16px; margin:0 0 4px; }
  p.hint { margin:0 0 12px; color:var(--muted); font-size:12px; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  button { font:inherit; font-size:12px; padding:6px 10px; border:1px solid var(--line); background:#f7f7fb; border-radius:6px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  ul { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
  li { display:flex; align-items:center; gap:8px; padding:8px 2px; border-bottom:1px solid var(--line); }
  li .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  li .name { flex:1; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .name:hover { text-decoration:underline; }
  li .count { color:var(--muted); font-size:12px; }
  li.off .name { color:var(--muted); text-decoration:line-through; }
  .switch { position:relative; width:32px; height:18px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; background:#ccc; border-radius:18px; transition:.15s; cursor:pointer; }
  .switch span::before { content:""; position:absolute; width:14px; height:14px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + span { background:var(--accent); }
  .switch input:checked + span::before { transform:translateX(14px); }
  .opts { margin:8px 0; font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .opts label { display:flex; gap:4px; align-items:center; }
  select, input[type=range] { font:inherit; font-size:12px; }
  #status { margin-top:12px; font-size:12px; color:var(--muted); min-height:1.4em; }
</style>
</head>
<body>
<div id="panel" hidden>
  <h1>Focus par tag</h1>
  <p class="hint">Interrupteur : affiche / estompe les tickets du tag. Clic sur le nom : focus sur ce seul tag. Les tickets sans tag ne sont jamais estompés.</p>
  <div class="bar">
    <button id="all" class="primary">Tout réafficher</button>
    <button id="none">Tout estomper</button>
    <button id="refresh">Rafraîchir</button>
  </div>
  <div class="opts">
    <label><input type="radio" name="mode" value="veil" checked> Voile</label>
    <label><input type="radio" name="mode" value="color"> Recolorer</label>
  </div>
  <div class="opts" id="veilOpts">
    Opacité du voile : <input type="range" id="opacity" min="0.5" max="0.95" step="0.05" value="0.8"> <span id="opv">80 %</span>
  </div>
  <div class="opts" id="colorOpts" hidden>
    Couleur estompée :
    <select id="dim"><option value="gray">Gris</option><option value="white">Blanc</option></select>
  </div>
  <ul id="list"></ul>
  <div id="status"></div>
</div>

<script>
const IS_PANEL = new URLSearchParams(location.search).has('panel');
const META = 'tagToggle';           // v1 : métadonnées par ticket (lu seulement pour migration)
const APPDATA = 'dimmed';           // mode Recolorer : { [itemId]: couleurOrigine }
const VEIL_KEY = 'veil';            // mode Voile : id du rectangle-voile
const CARD_DIM = '#e6e6e6';
const DIM_COLORS = ['gray', 'white'];
const MARGIN = 2000;                // le voile déborde de la zone utilisée
const TAG_COLORS = { red:'#f24726', magenta:'#da0063', violet:'#9510ac', light_green:'#c9df56', green:'#8fd14f',
  dark_green:'#0ca789', cyan:'#12cdd4', blue:'#2d9bf0', dark_blue:'#414bb2', yellow:'#fac710', gray:'#808080', black:'#1a1a1a' };

let tags = [], items = [], allItems = [], dimmed = {}, veil = null, active = new Set(), busy = false;
const $ = (id) => document.getElementById(id);
const status = (t) => $('status').textContent = t;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const mode = () => document.querySelector('input[name=mode]:checked').value;

async function withRetry(fn) {
  for (let attempt = 0; ; attempt++) {
    try { return await fn(); }
    catch (e) {
      const msg = String((e && e.message) || e);
      if (attempt < 8 && /rate.?limit|too many/i.test(msg)) {
        const wait = Math.min(1000 * 2 ** attempt, 20000);
        status(`Limite Miro atteinte, pause ${Math.round(wait / 1000)} s…`);
        await sleep(wait);
      } else throw e;
    }
  }
}

async function batched(list, fn, size = 8, pause = 150) {
  for (let i = 0; i < list.length; i += size) {
    await Promise.all(list.slice(i, i + size).map(it => withRetry(() => fn(it))));
    status(`Mise à jour… ${Math.min(i + size, list.length)}/${list.length}`);
    if (i + size < list.length) await sleep(pause);
  }
}

const tagsOf = (it) => it.tagIds || [];
const isDimmed = (it) => it.id in dimmed;
const colorOf = (it) => it.type === 'card' ? it.style.cardTheme : it.style.fillColor;
const setColor = (it, c) => { if (it.type === 'card') it.style.cardTheme = c; else it.style.fillColor = c; };
const saveDimmed = () => withRetry(() => miro.board.setAppData(APPDATA, dimmed));
// Sans tag => toujours visible ; sinon visible si au moins un de ses tags est allumé
const shouldShow = (it) => tagsOf(it).length === 0 || tagsOf(it).some(id => active.has(id));
const allIds = () => tags.map(t => t.id);

// ---------- Chargement ----------
async function load() {
  status('Lecture du board…');
  tags = await withRetry(() => miro.board.get({ type: 'tag' }));
  allItems = await withRetry(() => miro.board.get());
  items = allItems.filter(it => it.type === 'sticky_note' || it.type === 'card');
  dimmed = (await withRetry(() => miro.board.getAppData(APPDATA))) || {};
  const ids = new Set(items.map(it => it.id));
  for (const id of Object.keys(dimmed)) if (!ids.has(id)) delete dimmed[id];

  // Voile existant ?
  const veilId = await withRetry(() => miro.board.getAppData(VEIL_KEY));
  veil = veilId ? allItems.find(it => it.id === veilId) || null : null;

  // Migration v1 (métadonnées par ticket)
  const suspects = items.filter(it => !isDimmed(it) &&
    (it.type === 'card' ? colorOf(it) === CARD_DIM : DIM_COLORS.includes(colorOf(it))));
  let migrated = 0;
  await batched(suspects, async (it) => {
    const m = await it.getMetadata(META);
    if (m && m.dimmed && m.orig) { dimmed[it.id] = m.orig; migrated++; }
  });
  if (migrated) await saveDimmed();

  // État initial : tout actif, sauf si un estompage "couleur" est en cours
  active = new Set(allIds().filter(id => {
    const its = items.filter(it => tagsOf(it).includes(id));
    return its.length === 0 || its.some(it => !isDimmed(it));
  }));
  render();
  status(`${items.length} tickets, ${tags.length} tags${veil ? ' — voile actif' : ''}.`);
}

function render() {
  const rows = [...tags.map(t => ({ id: t.id, title: t.title, color: TAG_COLORS[t.color] || t.color || '#999' }))];
  $('list').innerHTML = '';
  for (const r of rows) {
    const n = items.filter(it => tagsOf(it).includes(r.id)).length;
    const li = document.createElement('li');
    if (!active.has(r.id)) li.className = 'off';
    li.innerHTML = `<label class="switch"><input type="checkbox" ${active.has(r.id) ? 'checked' : ''}><span></span></label>
      <span class="dot" style="background:${r.color};border:1px solid #ccc"></span>
      <span class="name" title="Focus sur ce tag"></span><span class="count">${n}</span>`;
    li.querySelector('.name').textContent = r.title;
    li.querySelector('input').onchange = (e) => { e.target.checked ? active.add(r.id) : active.delete(r.id); apply(); };
    li.querySelector('.name').onclick = () => { active = new Set([r.id]); apply(); };
    $('list').appendChild(li);
  }
}

// ---------- Mode Voile ----------
function boardBounds() {
  // Uniquement les éléments de premier niveau (les enfants de frames ont des coordonnées relatives)
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const it of allItems) {
    if (it.parentId || it.id === (veil && veil.id)) continue;
    if (typeof it.x !== 'number' || typeof it.width !== 'number') continue;
    const h = it.height || it.width;
    x0 = Math.min(x0, it.x - it.width / 2); x1 = Math.max(x1, it.x + it.width / 2);
    y0 = Math.min(y0, it.y - h / 2);        y1 = Math.max(y1, it.y + h / 2);
  }
  if (!isFinite(x0)) return { x: 0, y: 0, width: 10000, height: 10000 };
  return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, width: x1 - x0 + 2 * MARGIN, height: y1 - y0 + 2 * MARGIN };
}

async function removeVeil() {
  if (!veil) return;
  try { await withRetry(() => miro.board.remove(veil)); } catch (e) { console.warn(e); }
  veil = null;
  await withRetry(() => miro.board.setAppData(VEIL_KEY, null));
}

async function sendBack(list) {
  if (!list.length) return;
  try { await withRetry(() => miro.board.sendToBack(list)); }         // 1 appel pour toute la liste
  catch (e) {                                                         // repli si la liste est refusée
    console.warn('sendToBack(liste) refusé, repli par lots', e);
    await batched(list, (it) => miro.board.sendToBack(it));
  }
}

// Le voile est placé le plus en arrière possible : seuls les tickets estompés passent derrière lui.
// Tout le reste (tickets sans tag, tags allumés, flèches, textes…) reste devant.
async function applyVeil() {
  const hidden = items.filter(it => !shouldShow(it));
  if (!hidden.length) { await removeVeil(); return 'voile retiré'; }
  const opacity = parseFloat($('opacity').value);
  if (!veil) {
    veil = await withRetry(() => miro.board.createShape({
      shape: 'rectangle', content: '', ...boardBounds(),
      style: { fillColor: '#ffffff', fillOpacity: opacity, borderOpacity: 0, borderWidth: 1 },
    }));
    await withRetry(() => miro.board.setAppData(VEIL_KEY, veil.id));
  } else if (veil.style.fillOpacity !== opacity) {
    veil.style.fillOpacity = opacity; await withRetry(() => veil.sync());
  }
  await withRetry(() => miro.board.sendToBack(veil));   // voile tout au fond (les anciens estompés repassent devant)
  await sendBack(hidden);                               // puis les estompés actuels passent derrière le voile
  return `${hidden.length} ticket(s) estompé(s)`;
}

// ---------- Mode Recolorer ----------
async function applyColor() {
  const dim = $('dim').value;
  const toDim = items.filter(it => !shouldShow(it) && !isDimmed(it));
  const toShow = items.filter(it => shouldShow(it) && isDimmed(it));
  if (toDim.length) { for (const it of toDim) dimmed[it.id] = colorOf(it); await saveDimmed(); }
  await batched(toDim, async (it) => { setColor(it, it.type === 'card' ? CARD_DIM : dim); await it.sync(); });
  await batched(toShow, async (it) => { setColor(it, dimmed[it.id]); await it.sync(); delete dimmed[it.id]; });
  if (toShow.length) await saveDimmed();
  return `${toDim.length} estompé(s), ${toShow.length} réaffiché(s)`;
}

async function restoreColors() {
  const list = items.filter(isDimmed);
  await batched(list, async (it) => { setColor(it, dimmed[it.id]); await it.sync(); delete dimmed[it.id]; });
  if (list.length) await saveDimmed();
}

// ---------- Orchestration ----------
async function apply() {
  if (busy) return;
  busy = true; document.querySelectorAll('button').forEach(b => b.disabled = true);
  render();
  try {
    let msg;
    if (mode() === 'veil') { await restoreColors(); msg = await applyVeil(); }
    else { await removeVeil(); msg = await applyColor(); }
    status('OK : ' + msg + '.');
  } catch (e) {
    console.error(e); status('Erreur : ' + (e.message || e));
    try { await saveDimmed(); } catch (_) {}
  } finally {
    busy = false; document.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

function syncModeUI() {
  $('veilOpts').hidden = mode() !== 'veil';
  $('colorOpts').hidden = mode() !== 'color';
}

async function init() {
  $('all').onclick = () => { active = new Set(allIds()); apply(); };
  $('none').onclick = () => { active = new Set(); apply(); };
  $('refresh').onclick = () => load().catch(e => status('Erreur : ' + (e.message || e)));
  document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => { syncModeUI(); apply(); });
  $('opacity').oninput = () => { $('opv').textContent = Math.round($('opacity').value * 100) + ' %'; };
  $('opacity').onchange = () => { if (veil) apply(); };
  syncModeUI();
  try { await load(); } catch (e) { console.error(e); status('Erreur : ' + (e.message || e)); }
}

// Démarrage : APRÈS toutes les déclarations
if (!IS_PANEL) {
  miro.board.ui.on('icon:click', async () => {
    await miro.board.ui.openPanel({ url: 'index.html?panel=1' });
  });
} else {
  $('panel').hidden = false;
  init();
}
</script>
</body>
</html>
